name: Feature request
description: Suggest a useful Edgelings improvement.
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      placeholder: I miss it when an agent finishes while I am in another window...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      placeholder: Edgelings should...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Bots and bubbles
        - Hover card
        - Usage and limits
        - Usage & cost page
        - Settings and tray
        - Another agent
        - macOS port
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: |
        Include any links, screenshots, or examples from your workflow that help explain the request.
