name: Bug report
description: Report a broken Edgelings behavior.
title: "[Bug]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail to reproduce it on Windows or macOS.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the visible behavior and what you expected instead.
      placeholder: A bot showed "needs approval" for the wrong session...
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Claude Desktop
        - Codex
        - Kimi Code
        - Antigravity
        - Cursor
        - Grok
        - Grok Bot
        - DeepSeek Harness
        - More than one
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Build
      description: The commit, or the GitHub Actions run a test package came from.
      placeholder: a commit hash, or "Windows CI run 12"
    validations:
      required: true

  - type: dropdown
    id: operating_system
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
    validations:
      required: true

  - type: input
    id: os_build
    attributes:
      label: OS version / build and device
      placeholder: Windows 11 23H2 (Build 22631), ThinkPad X1 OR macOS 15.5, MacBook Pro M3 Pro
    validations:
      required: true

  - type: dropdown
    id: display
    attributes:
      label: Display setup
      options:
        - One display
        - Multiple displays
        - Notched MacBook screen
        - Non-notched Mac screen
        - Not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a Claude Code run.
        2. Let it finish in the background.
        3. Hover the bot.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: |
        Screenshots help. Please remove private project paths,
        session titles, API keys, tokens, or sensitive content before uploading.
