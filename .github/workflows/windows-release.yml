name: Windows Release

# ONE tag ships both platforms. The attach step waits for the macOS job's
# release, which is what carries the Sparkle appcast.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach the Windows zip to"
        required: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        working-directory: windows
        run: dotnet run --project tests/AgentIsland.Tests -c Release

      - name: Build (version = VERSION file)
        shell: pwsh
        working-directory: windows
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $v = (Get-Content ..\VERSION -Raw).Trim()
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$' -or "v$v" -ne $env:RELEASE_TAG) { throw 'Tag and VERSION disagree' }
          .\build.ps1 -Version $v

      # The macOS job creates the release (with the Sparkle appcast). Wait for
      # it so a Windows-only release can never occupy `latest` without the
      # appcast — that would 404 every Mac user's auto-update.
      - name: Attach zip once the signed macOS release is published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          for i in $(seq 1 30); do
            ready="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft,assets --jq '.isDraft == false and any(.assets[]; .name == "appcast.xml") and any(.assets[]; .name == "AgentIsland-'"${TAG#v}"'.dmg")' 2>/dev/null || true)"
            [[ "$ready" == "true" ]] && break
            sleep 20
          done
          [[ "$ready" == "true" ]] || { echo "::error::Published release with appcast.xml is not ready"; exit 1; }
          gh release upload "$TAG" windows/dist/AgentIsland-*.zip --clobber -R "$GITHUB_REPOSITORY"
