# The Pixel engine on JavaScriptCore itself (the Mac app's script engine): the
# frozen engine against the live one, timed per look, and the differential test
# run on JavaScriptCore too.
name: macOS Pixel engine on JavaScriptCore

on:
  push:
    branches: ["mac/**"]
    paths:
      - "windows/tests/engine-diff/**"
      - "windows/src/AgentIsland.WinUI/Drawer/Characters/characters.mjs"
      - ".github/workflows/macos-jsc.yml"
  workflow_dispatch:

jobs:
  jsc:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build the runner
        run: swiftc -O windows/tests/engine-diff/jsc-run.swift -o jsc-run

      # Signed with allow-jit, as the app is: without it JavaScriptCore runs as an interpreter (about 3.5x slower).
      - name: Sign the runner with the app's entitlement
        run: codesign --force -s - --entitlements macos/app/Edgelings.entitlements jsc-run

      - name: Time and diff the engines on JavaScriptCore
        timeout-minutes: 15
        run: |
          set -o pipefail
          ./jsc-run windows/tests/engine-diff/characters.frozen.mjs windows/src/AgentIsland.WinUI/Drawer/Characters/characters.mjs windows/tests/engine-diff/diff-core.mjs 500 2 | tee jsc-result.txt
          { echo '```'; cat jsc-result.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Primitive costs on JavaScriptCore
        run: ./jsc-run --micro windows/tests/engine-diff/micro.js | tee -a jsc-result.txt

      - name: Where a frame's time goes on JavaScriptCore
        run: ./jsc-run --profile windows/src/AgentIsland.WinUI/Drawer/Characters/characters.mjs windows/tests/engine-diff/profile.js | tee -a jsc-result.txt

      - name: The same profile for the engine one version back (v5.4.2), for the comparison
        run: |
          echo "== engine v5.4.2 (macos/app/tools/engines-ref/characters-v5.4.2.mjs)" | tee -a jsc-result.txt
          ./jsc-run --profile macos/app/tools/engines-ref/characters-v5.4.2.mjs windows/tests/engine-diff/profile.js | tee -a jsc-result.txt
          echo "== hot loop and the micro costs again, JIT on" | tee -a jsc-result.txt
          ./jsc-run --micro windows/tests/engine-diff/micro.js | tee -a jsc-result.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-engine-jsc
          path: jsc-result.txt
