name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: macos-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_ref=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.source_ref }}

      - name: Install DMG tooling
        run: pipx install dmgbuild

      - name: Validate version and prepare changelog
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="${TAG#v}"
          test "$(tr -d '\r\n' < VERSION)" = "$version" || { echo "::error::Tag and VERSION disagree"; exit 1; }
          notes="$RUNNER_TEMP/agent-island-release-notes.md"
          awk -v ver="$version" 'index($0,"## ["ver"]")==1 {f=1; print; next} f && /^## \[/ {exit} f' CHANGELOG.md > "$notes"
          test -s "$notes" || { echo "::error::Missing CHANGELOG.md section for $version"; exit 1; }
          echo "RELEASE_NOTES_PATH=$notes" >> "$GITHUB_ENV"

      - name: Prepare Sparkle signing key
        shell: bash
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [[ -z "${SPARKLE_ED_PRIVATE_KEY:-}" ]]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY secret is missing; cannot generate signed appcast.xml"
            exit 1
          fi
          key_path="$RUNNER_TEMP/sparkle_ed_private_key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "SPARKLE_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          bash ./scripts/test-codex-accounts.sh
          ./scripts/test-usage-cache.sh
          ./scripts/test-session-turn-state.sh
          ./scripts/test-reminder-delivery-key.sh

      - name: Build release assets
        shell: bash
        run: |
          ./release.sh
          test -f dist/appcast.xml

      - name: Prepare draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            [[ "$state" == "true" ]] || { echo "::error::Refusing to overwrite a published release"; exit 1; }
          else
            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --title "$TAG — Agent Island" \
              --notes-file "$RELEASE_NOTES_PATH"
          fi

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="${TAG#v}"
          gh release upload "$TAG" \
            "dist/AgentIsland-${version}.dmg" \
            "dist/appcast.xml" \
            --clobber

      - name: Publish complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$TAG" --notes-file "$RELEASE_NOTES_PATH" --draft=false
