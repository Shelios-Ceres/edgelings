# Windows-only: the WinUI app and its tests don't build on Linux or macOS,
# so this is the only pre-tag compile check the Windows port gets.
name: Windows CI

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows-ci.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-ci.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build windows/src/AgentIsland.WinUI/AgentIsland.WinUI.csproj -c Release -p:Platform=x64

      - name: Test
        working-directory: windows
        run: dotnet run --project tests/AgentIsland.Tests -c Release

      - name: Audit WinUI dependencies
        shell: pwsh
        run: |
          $json = dotnet list windows/src/AgentIsland.WinUI/AgentIsland.WinUI.csproj package --vulnerable --include-transitive --no-restore --format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = ($json -join "`n") | ConvertFrom-Json
          if ($report.logs | Where-Object level -eq 'error') { throw 'Dependency audit failed' }
          $packages = $report.projects.frameworks | ForEach-Object { $_.topLevelPackages; $_.transitivePackages }
          $unsafe = $packages | Where-Object { $_.vulnerabilities | Where-Object severity -in @('High', 'Critical') }
          if ($unsafe) { $unsafe | ConvertTo-Json -Depth 8; throw 'High or critical dependency vulnerability' }

      # A downloadable test build for every push — lets a maintainer try the
      # branch without cutting a release/tag (which would ship to all users
      # via auto-update). Grab it from the run's Artifacts section.
      - name: Package test build
        shell: pwsh
        working-directory: windows
        run: .\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: AgentIsland-win-x64-test
          path: windows/dist/AgentIsland-*.zip
          if-no-files-found: error

      # A stable, public, no-login download for testing: refresh a single
      # PRERELEASE (tag windows-test) with the latest zip on every push to
      # the working branch. Prerelease + non-'v*' tag = it never occupies
      # releases/latest and never triggers the Sparkle/Windows auto-update
      # flows, so no existing user is affected.
      - name: Refresh test prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/windows-ui-layout-audit-n94f76'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-test --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create windows-test windows/dist/AgentIsland-*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Windows test build (unstable)" \
            --notes "Latest Windows test build from the windows-ui-layout-audit branch. Prerelease only — NOT shipped via auto-update. Download the zip, unzip, run AgentIsland.WinUI.exe."
