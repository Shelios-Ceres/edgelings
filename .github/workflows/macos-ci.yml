# The macOS app is otherwise only compiled at tag time (release.yml) —
# a Swift break would surface mid-release and burn a version number.
name: macOS CI

on:
  push:
    paths:
      - "Sources/**"
      - "Resources/**"
      - "Tests/**"
      - "build.sh"
      - "scripts/**"
      - ".github/workflows/macos-ci.yml"
  pull_request:
    paths:
      - "Sources/**"
      - "Resources/**"
      - "Tests/**"
      - "build.sh"
      - "scripts/**"
      - ".github/workflows/macos-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Unit suites
        run: |
          bash ./scripts/test-codex-accounts.sh
          ./scripts/test-usage-cache.sh
          ./scripts/test-session-turn-state.sh
          ./scripts/test-reminder-delivery-key.sh

      - name: Build (auto-update disabled)
        run: SU_FEED_URL= ./build.sh

      # A downloadable test build, like Windows CI's: unsigned by Apple, so the
      # first launch needs right-click > Open. ditto keeps the bundle's symlinks.
      - name: Package test build
        run: ditto -c -k --keepParent build/AgentIsland.app AgentIsland-macos-test.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AgentIsland-macos-test
          path: AgentIsland-macos-test.zip
          if-no-files-found: error
